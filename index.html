<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Cobro POS - QR Dinámico</title>
    <!-- Librería estándar para dibujar el código QR en un Canvas -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --primary-green: #00c853;
            --primary-green-hover: #00a843;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .pos-container {
            width: 100%;
            max-width: 380px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .header h2 {
            font-size: 1.2rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Campo de Monto Dinámico */
        .monto-section {
            background-color: #f8fafc;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .monto-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .monto-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .monto-symbol {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .monto-input {
            width: 130px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
        }

        /* Selector de Métodos de Pago */
        .metodos-pago {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metodo-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
        }

        .metodo-card.active {
            border-color: var(--primary-green);
            background-color: #e8f5e9;
        }

        .metodo-card .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Tarjeta del QR */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .qr-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .qr-canvas-container {
            padding: 8px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 8px;
        }

        .titular-info {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .titular-nombre {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Botón de Confirmar Venta */
        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
            transition: background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            background-color: var(--primary-green-hover);
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <div class="header">
            <h2>Revisar Orden</h2>
        </div>

        <!-- Campo donde cambias el monto dinámicamente -->
        <div class="monto-section">
            <div class="monto-label">Total a Cobrar</div>
            <div class="monto-input-wrapper">
                <span class="monto-symbol">S/</span>
                <input type="number" id="montoInput" class="monto-input" value="5.30" step="0.10" min="0" oninput="actualizarQR()">
            </div>
        </div>

        <div class="metodos-pago">
            <div class="metodo-card">
                <div class="label">💵 Efectivo</div>
            </div>
            <div class="metodo-card active">
                <div class="label">📲 QR Yape/Plin</div>
            </div>
            <div class="metodo-card">
                <div class="label">💳 Tarjeta</div>
            </div>
        </div>

        <div class="qr-section">
            <div class="qr-title">Escanea para pagar con Yape o Plin</div>
            <div class="qr-canvas-container">
                <canvas id="qr-canvas"></canvas>
            </div>
            <div class="titular-info">Titular:</div>
            <div class="titular-nombre" id="nombreTitular">EDAX AGENCY</div>
        </div>

        <button class="btn-confirmar" onclick="confirmarVenta()">
            ✓ Confirmar Venta
        </button>
    </div>

    <script>
        // CONFIGURACIÓN DE TU CUENTA
        const CONFIG_COMERCIO = {
            telefono: "987654321", // <-- Coloca aquí tu número registrado en Plin / Yape
            titular: "EDAX AGENCY"
        };

        /**
         * Algoritmo de Verificación CRC16 (ISO 3309)
         * Requerido por la norma EMVCo para validar que la cadena del QR no fue alterada.
         */
        function calcularCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                    } else {
                        crc = (crc << 1) & 0xFFFF;
                    }
                }
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }

        /**
         * Genera el payload de texto con la especificación EMVCo de Perú
         */
        function generarPayloadEMVCo(monto, telefono) {
            const payloadIndicator = "000201";  // EMVCo Versión 01
            const pointOfInitiation = "010212"; // 12 = QR Dinámico (Monto precargado)
            
            // Tag 26: Especificación Interoperable de Perú
            const idPlin = 0009PE.PLIN.0109${telefono};
            const merchantInfoTag = 26${idPlin.length.toString().padStart(2, '0')}${idPlin};

            const currency = "5303604";          // Código ISO 604 = Sol Peruano (PEN)
            
            // Formateo del monto exacto con 2 decimales
            const montoVal = parseFloat(monto) || 0;
            const montoFormatted = montoVal.toFixed(2);
            const amountTag = 54${montoFormatted.length.toString().padStart(2, '0')}${montoFormatted};
            
            const countryCode = "5802PE";        // Perú

            // Cadena base sin el código CRC
            const basePayload = ${payloadIndicator}${pointOfInitiation}${merchantInfoTag}${currency}${amountTag}${countryCode}6304;
            
            // Genera y concatena la firma CRC16
            const checksum = calcularCRC16(basePayload);
            return ${basePayload}${checksum};
        }

        /**
         * Renderiza el código QR en el Canvas HTML
         */
        function actualizarQR() {
            const montoInput = document.getElementById('montoInput').value;
            const monto = parseFloat(montoInput) || 0;

            // 1. Crear la cadena EMVCo
            const emvcoString = generarPayloadEMVCo(monto, CONFIG_COMERCIO.telefono);

            // 2. Dibujar el QR mediante QRCode.js
            const canvas = document.getElementById('qr-canvas');
            QRCode.toCanvas(canvas, emvcoString, {
                width: 170,
                margin: 1,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            });
        }

        function confirmarVenta() {
            const monto = document.getElementById('montoInput').value;
            alert(¡Venta confirmada por S/ ${parseFloat(monto).toFixed(2)}!);
        }

        // Genera el primer QR apenas abre la pantalla
        window.onload = function() {
            actualizarQR();
        };
    </script>
</body>
</html>
