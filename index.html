<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Cobro POS - Profesional</title>
    <style>
        :root {
            --primary-green: #00c853;
            --primary-green-hover: #00a843;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .pos-container {
            width: 100%;
            max-width: 390px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .header h2 {
            font-size: 1.1rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .timer {
            font-size: 0.75rem;
            background: #ffebee;
            color: #c62828;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
        }

        .monto-section {
            background-color: #f8fafc;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .monto-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .monto-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .monto-symbol {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .monto-input {
            width: 120px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-dark);
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
        }

        .metodos-pago {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metodo-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            user-select: none;
        }

        .metodo-card.active {
            border-color: var(--primary-green);
            background-color: #e8f5e9;
        }

        .metodo-card .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            pointer-events: none;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .qr-section.hidden {
            display: none;
        }

        .qr-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .qr-img-container {
            padding: 6px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 8px;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-img-container img {
            width: 148px;
            height: 148px;
            object-fit: contain;
            border-radius: 6px;
        }

        .titular-info {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .titular-nombre {
            font-size: 0.8rem;
            color: var(--text-dark);
            font-weight: 700;
            margin-bottom: 6px;
        }

        /* Botón de copiar número */
        .btn-copiar {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copiar:hover {
            background: #e2e8f0;
        }

        /* Panel de Efectivo con cálculo de vuelto */
        .efectivo-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
            width: 100%;
        }
        .efectivo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 600;
        }
        .efectivo-row input {
            width: 90px;
            padding: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: right;
            outline: none;
        }

        .btn-confirmar {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
            transition: background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            background-color: var(--primary-green-hover);
        }

        /* Modal de Éxito Oculto */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-icon {
            font-size: 3rem;
        }
        .modal-card h3 {
            color: var(--text-dark);
            font-size: 1.2rem;
        }
        .modal-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .modal-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <div class="header">
            <h2>Revisar Orden</h2>
            <div class="timer" id="timer">⏱️ 05:00</div>
        </div>

        <div class="monto-section">
            <div class="monto-label">Total a Cobrar</div>
            <div class="monto-input-wrapper">
                <span class="monto-symbol">S/</span>
                <input type="number" id="montoInput" class="monto-input" value="3.00" step="0.10" min="0" oninput="calcularVuelto()">
            </div>
        </div>

        <div class="metodos-pago">
            <div class="metodo-card" id="card-efectivo" onclick="seleccionarMetodo('efectivo')">
                <div class="label">💵 Efectivo</div>
            </div>
            <div class="metodo-card active" id="card-yape" onclick="seleccionarMetodo('yape')">
                <div class="label">💜 QR Yape</div>
            </div>
            <div class="metodo-card" id="card-plin" onclick="seleccionarMetodo('plin')">
                <div class="label">💙 QR Plin</div>
            </div>
        </div>

        <!-- Panel QR (Yape / Plin) -->
        <div class="qr-section" id="panel-qr">
            <div class="qr-title" id="qr-titulo">Escanea para pagar con Yape</div>
            <div class="qr-img-container">
                <img id="imagenQr" src="qr-yape.jpeg" alt="Código QR">
            </div>
            <div class="titular-info">Titular:</div>
            <div class="titular-nombre">KIMBERLY ALBERCA</div>
            <button class="btn-copiar" onclick="copiarNumero()">📋 Copiar Celular: 968495402</button>
        </div>

        <!-- Panel Efectivo con cálculo de vuelto -->
        <div class="qr-section hidden" id="panel-efectivo">
            <div class="efectivo-panel">
                <div class="efectivo-row">
                    <span>Efectivo Recibido:</span>
                    <input type="number" id="pagoCliente" value="3.00" step="0.50" oninput="calcularVuelto()">
                </div>
                <div class="efectivo-row" style="border-top: 1px dashed var(--border-color); padding-top: 8px;">
                    <span>Vuelto a entregar:</span>
                    <span id="vueltoTxt" style="color: var(--primary-green); font-size: 1.1rem;">S/ 0.00</span>
                </div>
            </div>
        </div>

        <button class="btn-confirmar" onclick="confirmarVenta()">
            ✓ Verificar Pago / Confirmar
        </button>
    </div>

    <!-- Modal de Éxito -->
    <div class="modal-overlay" id="modalExito">
        <div class="modal-card">
            <div class="modal-icon">✅</div>
            <h3>¡Pago Registrado!</h3>
            <p id="modalDetalle">La transacción se completó correctamente.</p>
            <button class="modal-btn" onclick="cerrarModal()">Aceptar / Siguiente</button>
        </div>
    </div>

    <script>
        let metodoActual = 'yape';

        function seleccionarMetodo(metodo) {
            metodoActual = metodo;

            document.getElementById('card-efectivo').classList.remove('active');
            document.getElementById('card-yape').classList.remove('active');
            document.getElementById('card-plin').classList.remove('active');
            document.getElementById(`card-${metodo}`).classList.add('active');

            const panelQr = document.getElementById('panel-qr');
            const panelEfectivo = document.getElementById('panel-efectivo');
            const imagenQr = document.getElementById('imagenQr');
            const tituloQr = document.getElementById('qr-titulo');

            if (metodo === 'efectivo') {
                panelQr.classList.add('hidden');
                panelEfectivo.classList.remove('hidden');
                calcularVuelto();
            } else {
                panelEfectivo.classList.add('hidden');
                panelQr.classList.remove('hidden');
                
                if (metodo === 'yape') {
                    tituloQr.innerText = "Escanea para pagar con Yape";
                    imagenQr.src = "qr-yape.jpeg";
                } else {
                    tituloQr.innerText = "Escanea para pagar con Plin";
                    imagenQr.src = "qr-plin.jpeg";
                }
            }
        }

        function copiarNumero() {
            navigator.clipboard.writeText("968495402");
            alert("¡Número 968495402 copiado al portapapeles!");
        }

        function calcularVuelto() {
            const montoTotal = parseFloat(document.getElementById('montoInput').value) || 0;
            const pagoRecibido = parseFloat(document.getElementById('pagoCliente').value) || 0;
            let vuelto = pagoRecibido - montoTotal;
            if (vuelto < 0) vuelto = 0;
            document.getElementById('vueltoTxt').innerText = `S/ ${vuelto.toFixed(2)}`;
        }

        function confirmarVenta() {
            const monto = document.getElementById('montoInput').value;
            const modal = document.getElementById('modalExito');
            const detalle = document.getElementById('modalDetalle');

            if (metodoActual === 'efectivo') {
                const recibido = document.getElementById('pagoCliente').value;
                detalle.innerText = `Efectivo por S/ ${parseFloat(monto).toFixed(2)} registrado correctamente.`;
            } else {
                detalle.innerText = `Verifica que el abono de S/ ${parseFloat(monto).toFixed(2)} vía ${metodoActual.toUpperCase()} esté reflejado en tu app.`;
            }

            modal.classList.add('show');
        }

        function cerrarModal() {
            document.getElementById('modalExito').classList.remove('show');
        }

        // Temporizador simple de cuenta regresiva (5 minutos)
        let tiempoSegundos = 300;
        setInterval(() => {
            if (tiempoSegundos > 0) {
                tiempoSegundos--;
                let mins = Math.floor(tiempoSegundos / 60);
                let secs = tiempoSegundos % 60;
                document.getElementById('timer').innerText = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body>
</html>
