<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Pagos - Kimberly Alberca</title>
    <!-- Fuente moderna, limpia y antifatiga visual -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00c853;
            --primary-green-hover: #00a843;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .pos-container {
            width: 100vw;
            height: 100vh;
            max-width: 440px;
            max-height: 100vh;
            background-color: var(--card-bg);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .header h2 {
            font-size: 1.15rem;
            color: var(--text-dark);
            font-weight: 800;
        }

        .timer {
            font-size: 0.8rem;
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 800;
        }

        .monto-section {
            background-color: #f8fafc;
            border-radius: 14px;
            padding: 8px 12px;
            text-align: center;
            border: 2px solid #e2e8f0;
        }

        .monto-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 800;
        }

        .monto-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .monto-symbol {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-dark);
        }

        .monto-input {
            width: 130px;
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-dark);
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
        }

        .metodos-pago {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metodo-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            user-select: none;
        }

        .metodo-card.active {
            border-color: var(--primary-green);
            background-color: #f0fdf4;
            box-shadow: 0 3px 10px rgba(0, 200, 83, 0.15);
        }

        .metodo-card .label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-dark);
            pointer-events: none;
        }

        /* Sección QR optimizada para caber perfecta */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            flex-grow: 1;
            justify-content: center;
            margin: 2px 0;
        }

        .qr-section.hidden {
            display: none;
        }

        .qr-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .qr-img-container {
            padding: 8px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            margin-bottom: 6px;
            width: 185px;
            height: 185px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #f1f5f9;
        }

        .qr-img-container img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            border-radius: 6px;
        }

        .titular-info {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .titular-nombre {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 900;
            margin-bottom: 4px;
        }

        .btn-copiar {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copiar:hover {
            background: #e2e8f0;
        }
        .celular-numero {
            color: #0284c7;
            letter-spacing: 0.5px;
        }

        /* Panel de Efectivo Gigante y Destacado */
        .efectivo-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px;
            width: 100%;
        }
        .efectivo-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }
        .efectivo-box.resultado {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .efectivo-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .efectivo-input {
            width: 100%;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-dark);
            border: none;
            background: transparent;
            outline: none;
        }
        .vuelto-valor {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-green);
        }

        .btn-confirmar {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 200, 83, 0.3);
            transition: background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            background-color: var(--primary-green-hover);
        }

        /* Modal de Éxito */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-icon {
            font-size: 3rem;
        }
        .modal-card h3 {
            color: var(--text-dark);
            font-size: 1.2rem;
            font-weight: 900;
        }
        .modal-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
        }
        .modal-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <div class="header">
            <h2>Revisar Orden</h2>
            <div class="timer" id="timer">⏱️ 05:00</div>
        </div>

        <div class="monto-section">
            <div class="monto-label">Total a Cobrar</div>
            <div class="monto-input-wrapper">
                <span class="monto-symbol">S/</span>
                <!-- Inicia en 0.00 automáticamente -->
                <input type="number" id="montoInput" class="monto-input" value="0.00" step="0.50" min="0" oninput="calcularVuelto()">
            </div>
        </div>

        <div class="metodos-pago">
            <div class="metodo-card" id="card-efectivo" onclick="seleccionarMetodo('efectivo')">
                <div class="label">💵 Efectivo</div>
            </div>
            <div class="metodo-card active" id="card-yape" onclick="seleccionarMetodo('yape')">
                <div class="label">💜 QR Yape</div>
            </div>
            <div class="metodo-card" id="card-plin" onclick="seleccionarMetodo('plin')">
                <div class="label">💙 QR Plin</div>
            </div>
        </div>

        <!-- Panel QR (Yape / Plin) -->
        <div class="qr-section" id="panel-qr">
            <div class="qr-title" id="qr-titulo">Escanea para pagar con Yape</div>
            <div class="qr-img-container">
                <img id="imagenQr" src="qr-yape.jpeg" alt="Código QR">
            </div>
            <div class="titular-info">Titular:</div>
            <div class="titular-nombre">KIMBERLY ALBERCA</div>
            <button class="btn-copiar" onclick="copiarNumero()">
                📋 Copiar: <span class="celular-numero">968 495 402</span>
            </button>
        </div>

        <!-- Panel Efectivo con Cards Gigantes -->
        <div class="qr-section hidden" id="panel-efectivo">
            <div class="efectivo-panel">
                <div class="efectivo-box">
                    <span class="efectivo-label">Efectivo Recibido (S/)</span>
                    <input type="number" id="pagoCliente" class="efectivo-input" value="0.00" step="0.50" oninput="calcularVuelto()">
                </div>
                <div class="efectivo-box resultado">
                    <span class="efectivo-label">Vuelto a Entregar</span>
                    <div id="vueltoTxt" class="vuelto-valor">S/ 0.00</div>
                </div>
            </div>
        </div>

        <button class="btn-confirmar" onclick="confirmarVenta()">
            ✓ Verificar Pago / Confirmar
        </button>
    </div>

    <!-- Modal de Éxito -->
    <div class="modal-overlay" id="modalExito">
        <div class="modal-card">
            <div class="modal-icon">✅</div>
            <h3>¡Pago Registrado!</h3>
            <p id="modalDetalle">La transacción se completó correctamente.</p>
            <button class="modal-btn" onclick="cerrarModal()">Aceptar / Siguiente</button>
        </div>
    </div>

    <script>
        let metodoActual = 'yape';

        // Al cargar la página, se asegura de iniciar en 0.00
        window.onload = function() {
            document.getElementById('montoInput').value = "0.00";
            document.getElementById('pagoCliente').value = "0.00";
            calcularVuelto();
        };

        function seleccionarMetodo(metodo) {
            metodoActual = metodo;

            document.getElementById('card-efectivo').classList.remove('active');
            document.getElementById('card-yape').classList.remove('active');
            document.getElementById('card-plin').classList.remove('active');
            document.getElementById(`card-${metodo}`).classList.add('active');

            const panelQr = document.getElementById('panel-qr');
            const panelEfectivo = document.getElementById('panel-efectivo');
            const imagenQr = document.getElementById('imagenQr');
            const tituloQr = document.getElementById('qr-titulo');

            if (metodo === 'efectivo') {
                panelQr.classList.add('hidden');
                panelEfectivo.classList.remove('hidden');
                calcularVuelto();
            } else {
                panelEfectivo.classList.add('hidden');
                panelQr.classList.remove('hidden');
                
                if (metodo === 'yape') {
                    tituloQr.innerText = "Escanea para pagar con Yape";
                    imagenQr.src = "qr-yape.jpeg";
                } else {
                    tituloQr.innerText = "Escanea para pagar con Plin";
                    imagenQr.src = "qr-plin.jpeg";
                }
            }
        }

        function copiarNumero() {
            navigator.clipboard.writeText("968495402");
            alert("¡Número 968 495 402 copiado al portapapeles!");
        }

        function calcularVuelto() {
            const montoTotal = parseFloat(document.getElementById('montoInput').value) || 0;
            const pagoRecibido = parseFloat(document.getElementById('pagoCliente').value) || 0;
            let vuelto = pagoRecibido - montoTotal;
            if (vuelto < 0) vuelto = 0;
            document.getElementById('vueltoTxt').innerText = `S/ ${vuelto.toFixed(2)}`;
        }

        function confirmarVenta() {
            const monto = document.getElementById('montoInput').value;
            const modal = document.getElementById('modalExito');
            const detalle = document.getElementById('modalDetalle');

            if (monto <= 0) {
                alert("Por favor ingresa un monto válido mayor a 0");
                return;
            }

            if (metodoActual === 'efectivo') {
                detalle.innerText = `Efectivo por S/ ${parseFloat(monto).toFixed(2)} registrado correctamente.`;
            } else {
                detalle.innerText = `Verifica que el abono de S/ ${parseFloat(monto).toFixed(2)} vía ${metodoActual.toUpperCase()} esté reflejado en tu celular.`;
            }

            modal.classList.add('show');
        }

        function cerrarModal() {
            document.getElementById('modalExito').classList.remove('show');
            
            // Pone el total a cobrar en 0.00 automáticamente tras confirmar la venta
            document.getElementById('montoInput').value = "0.00";
            document.getElementById('pagoCliente').value = "0.00";
            calcularVuelto();
        }

        let tiempoSegundos = 300;
        setInterval(() => {
            if (tiempoSegundos > 0) {
                tiempoSegundos--;
                let mins = Math.floor(tiempoSegundos / 60);
                let secs = tiempoSegundos % 60;
                document.getElementById('timer').innerText = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body>
</html>
