<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Cobro POS - Yape y Plin</title>
    <style>
        :root {
            --primary-green: #00c853;
            --primary-green-hover: #00a843;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .pos-container {
            width: 100%;
            max-width: 380px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .header h2 {
            font-size: 1.2rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .monto-section {
            background-color: #f8fafc;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .monto-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .monto-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .monto-symbol {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .monto-input {
            width: 130px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
        }

        .metodos-pago {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metodo-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            user-select: none;
        }

        .metodo-card.active {
            border-color: var(--primary-green);
            background-color: #e8f5e9;
        }

        .metodo-card .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            pointer-events: none;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .qr-section.hidden {
            display: none;
        }

        .qr-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .qr-img-container {
            padding: 8px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 8px;
            width: 176px;
            height: 176px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-img-container img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 6px;
        }

        .titular-info {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .titular-nombre {
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .efectivo-msg {
            font-size: 0.9rem;
            color: var(--text-dark);
            padding: 20px;
            text-align: center;
            font-weight: 600;
        }

        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
            transition: background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            background-color: var(--primary-green-hover);
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <div class="header">
            <h2>Revisar Orden</h2>
        </div>

        <div class="monto-section">
            <div class="monto-label">Total a Cobrar</div>
            <div class="monto-input-wrapper">
                <span class="monto-symbol">S/</span>
                <input type="number" id="montoInput" class="monto-input" value="3.00" step="0.10" min="0">
            </div>
        </div>

        <div class="metodos-pago">
            <div class="metodo-card" id="card-efectivo" onclick="seleccionarMetodo('efectivo')">
                <div class="label">💵 Efectivo</div>
            </div>
            <div class="metodo-card active" id="card-yape" onclick="seleccionarMetodo('yape')">
                <div class="label">💜 QR Yape</div>
            </div>
            <div class="metodo-card" id="card-plin" onclick="seleccionarMetodo('plin')">
                <div class="label">💙 QR Plin</div>
            </div>
        </div>

        <div class="qr-section" id="panel-qr">
            <div class="qr-title" id="qr-titulo">Escanea para pagar con Yape</div>
            <div class="qr-img-container">
                <!-- Imagen oficial del QR subida a GitHub -->
                <img id="imagenQr" src="qr-yape.jpeg" alt="Código QR Yape">
            </div>
            <div class="titular-info">Titular:</div>
            <div class="titular-nombre" id="nombreTitular">KIMBERLY ALBERCA</div>
        </div>

        <div class="qr-section hidden" id="panel-efectivo">
            <div class="efectivo-msg">💵 Cobro en efectivo.<br>Reciba el monto exacto del cliente.</div>
        </div>

        <button class="btn-confirmar" onclick="confirmarVenta()">
            ✓ Verificar Pago / Confirmar
        </button>
    </div>

    <script>
        let metodoActual = 'yape';

        function seleccionarMetodo(metodo) {
            metodoActual = metodo;

            document.getElementById('card-efectivo').classList.remove('active');
            document.getElementById('card-yape').classList.remove('active');
            document.getElementById('card-plin').classList.remove('active');
            document.getElementById(`card-${metodo}`).classList.add('active');

            const panelQr = document.getElementById('panel-qr');
            const panelEfectivo = document.getElementById('panel-efectivo');
            const imagenQr = document.getElementById('imagenQr');
            const tituloQr = document.getElementById('qr-titulo');

            if (metodo === 'efectivo') {
                panelQr.classList.add('hidden');
                panelEfectivo.classList.remove('hidden');
            } else {
                panelEfectivo.classList.add('hidden');
                panelQr.classList.remove('hidden');
                
                if (metodo === 'yape') {
                    tituloQr.innerText = "Escanea para pagar con Yape";
                    imagenQr.src = "qr-yape.jpeg"; // Asegúrate de tener esta imagen en tu repositorio
                } else {
                    tituloQr.innerText = "Escanea para pagar con Plin";
                    imagenQr.src = "qr-plin.jpeg"; // Asegúrate de tener esta imagen en tu repositorio
                }
            }
        }

        function confirmarVenta() {
            const monto = document.getElementById('montoInput').value;
            if (metodoActual === 'efectivo') {
                alert(`Venta en efectivo registrada por S/ ${parseFloat(monto).toFixed(2)}`);
            } else {
                alert(`Verificando constancia de ${metodoActual.toUpperCase()} por S/ ${parseFloat(monto).toFixed(2)} en tu celular...`);
            }
        }
    </script>
</body>
</html>
