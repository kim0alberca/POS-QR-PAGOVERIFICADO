<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Pagos - Kimberly Alberca</title>
    <style>
        :root {
            --primary-green: #00c853;
            --primary-green-hover: #00a843;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }

        /* Contenedor a tamaño completo de pantalla */
        .pos-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px; /* Ancho máximo ideal para celulares tipo app */
            max-height: 100vh;
            background-color: var(--card-bg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .header h2 {
            font-size: 1.25rem;
            color: var(--text-dark);
            font-weight: 800;
        }

        .timer {
            font-size: 0.85rem;
            background: #fee2e2;
            color: #dc2626;
            padding: 6px 10px;
            border-radius: 10px;
            font-weight: 700;
        }

        .monto-section {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            border: 2px solid #e2e8f0;
        }

        .monto-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .monto-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .monto-symbol {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-dark);
        }

        .monto-input {
            width: 140px;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-dark);
            border: none;
            background: transparent;
            text-align: left;
            outline: none;
        }

        .metodos-pago {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .metodo-card {
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            user-select: none;
        }

        .metodo-card.active {
            border-color: var(--primary-green);
            background-color: #f0fdf4;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.15);
        }

        .metodo-card .label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-dark);
            pointer-events: none;
        }

        /* Sección QR Ampliada y Llamativa */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            flex-grow: 1;
            justify-content: center;
            margin: 4px 0;
        }

        .qr-section.hidden {
            display: none;
        }

        .qr-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .qr-img-container {
            padding: 10px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 10px;
            width: 230px;
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #f1f5f9;
        }

        .qr-img-container img {
            width: 210px;
            height: 210px;
            object-fit: contain;
            border-radius: 8px;
        }

        .titular-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .titular-nombre {
            font-size: 0.9rem;
            color: var(--text-dark);
            font-weight: 800;
            margin-bottom: 8px;
        }

        /* Celular grande y separado de 3 en 3 */
        .btn-copiar {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copiar:hover {
            background: #e2e8f0;
        }
        .celular-numero {
            color: #0284c7;
            letter-spacing: 1px;
        }

        /* Panel de Efectivo */
        .efectivo-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 10px;
            width: 100%;
        }
        .efectivo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 700;
        }
        .efectivo-row input {
            width: 120px;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            text-align: right;
            outline: none;
            font-weight: 800;
        }

        .btn-confirmar {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 200, 83, 0.35);
            transition: background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            background-color: var(--primary-green-hover);
        }

        /* Modal de Éxito */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #fff;
            padding: 28px;
            border-radius: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-icon {
            font-size: 3.5rem;
        }
        .modal-card h3 {
            color: var(--text-dark);
            font-size: 1.3rem;
            font-weight: 800;
        }
        .modal-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .modal-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <div class="header">
            <h2>Revisar Orden</h2>
            <div class="timer" id="timer">⏱️ 05:00</div>
        </div>

        <div class="monto-section">
            <div class="monto-label">Total a Cobrar</div>
            <div class="monto-input-wrapper">
                <span class="monto-symbol">S/</span>
                <input type="number" id="montoInput" class="monto-input" value="3.00" step="0.10" min="0" oninput="calcularVuelto()">
            </div>
        </div>

        <div class="metodos-pago">
            <div class="metodo-card" id="card-efectivo" onclick="seleccionarMetodo('efectivo')">
                <div class="label">💵 Efectivo</div>
            </div>
            <div class="metodo-card active" id="card-yape" onclick="seleccionarMetodo('yape')">
                <div class="label">💜 QR Yape</div>
            </div>
            <div class="metodo-card" id="card-plin" onclick="seleccionarMetodo('plin')">
                <div class="label">💙 QR Plin</div>
            </div>
        </div>

        <!-- Panel QR (Yape / Plin) Grande -->
        <div class="qr-section" id="panel-qr">
            <div class="qr-title" id="qr-titulo">Escanea para pagar con Yape</div>
            <div class="qr-img-container">
                <img id="imagenQr" src="qr-yape.jpeg" alt="Código QR">
            </div>
            <div class="titular-info">Titular:</div>
            <div class="titular-nombre">KIMBERLY ALBERCA</div>
            <button class="btn-copiar" onclick="copiarNumero()">
                📋 Copiar: <span class="celular-numero">968 495 402</span>
            </button>
        </div>

        <!-- Panel Efectivo -->
        <div class="qr-section hidden" id="panel-efectivo">
            <div class="efectivo-panel">
                <div class="efectivo-row">
                    <span>Efectivo Recibido:</span>
                    <input type="number" id="pagoCliente" value="3.00" step="0.50" oninput="calcularVuelto()">
                </div>
                <div class="efectivo-row" style="border-top: 2px dashed #e2e8f0; padding-top: 12px;">
                    <span>Vuelto a entregar:</span>
                    <span id="vueltoTxt" style="color: var(--primary-green); font-size: 1.3rem; font-weight: 900;">S/ 0.00</span>
                </div>
            </div>
        </div>

        <button class="btn-confirmar" onclick="confirmarVenta()">
            ✓ Verificar Pago / Confirmar
        </button>
    </div>

    <!-- Modal de Éxito -->
    <div class="modal-overlay" id="modalExito">
        <div class="modal-card">
            <div class="modal-icon">✅</div>
            <h3>¡Pago Registrado!</h3>
            <p id="modalDetalle">La transacción se completó correctamente.</p>
            <button class="modal-btn" onclick="cerrarModal()">Aceptar / Siguiente</button>
        </div>
    </div>

    <script>
        let metodoActual = 'yape';

        function seleccionarMetodo(metodo) {
            metodoActual = metodo;

            document.getElementById('card-efectivo').classList.remove('active');
            document.getElementById('card-yape').classList.remove('active');
            document.getElementById('card-plin').classList.remove('active');
            document.getElementById(`card-${metodo}`).classList.add('active');

            const panelQr = document.getElementById('panel-qr');
            const panelEfectivo = document.getElementById('panel-efectivo');
            const imagenQr = document.getElementById('imagenQr');
            const tituloQr = document.getElementById('qr-titulo');

            if (metodo === 'efectivo') {
                panelQr.classList.add('hidden');
                panelEfectivo.classList.remove('hidden');
                calcularVuelto();
            } else {
                panelEfectivo.classList.add('hidden');
                panelQr.classList.remove('hidden');
                
                if (metodo === 'yape') {
                    tituloQr.innerText = "Escanea para pagar con Yape";
                    imagenQr.src = "qr-yape.jpeg";
                } else {
                    tituloQr.innerText = "Escanea para pagar con Plin";
                    imagenQr.src = "qr-plin.jpeg";
                }
            }
        }

        function copiarNumero() {
            navigator.clipboard.writeText("968495402");
            alert("¡Número 968 495 402 copiado al portapapeles!");
        }

        function calcularVuelto() {
            const montoTotal = parseFloat(document.getElementById('montoInput').value) || 0;
            const pagoRecibido = parseFloat(document.getElementById('pagoCliente').value) || 0;
            let vuelto = pagoRecibido - montoTotal;
            if (vuelto < 0) vuelto = 0;
            document.getElementById('vueltoTxt').innerText = `S/ ${vuelto.toFixed(2)}`;
        }

        function confirmarVenta() {
            const monto = document.getElementById('montoInput').value;
            const modal = document.getElementById('modalExito');
            const detalle = document.getElementById('modalDetalle');

            if (metodoActual === 'efectivo') {
                detalle.innerText = `Efectivo por S/ ${parseFloat(monto).toFixed(2)} registrado correctamente.`;
            } else {
                detalle.innerText = `Verifica que el abono de S/ ${parseFloat(monto).toFixed(2)} vía ${metodoActual.toUpperCase()} esté reflejado en tu celular.`;
            }

            modal.classList.add('show');
        }

        function cerrarModal() {
            document.getElementById('modalExito').classList.remove('show');
        }

        let tiempoSegundos = 300;
        setInterval(() => {
            if (tiempoSegundos > 0) {
                tiempoSegundos--;
                let mins = Math.floor(tiempoSegundos / 60);
                let secs = tiempoSegundos % 60;
                document.getElementById('timer').innerText = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body>
</html>
